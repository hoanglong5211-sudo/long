<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo thi công nhôm kính</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2740;--mute:#5f6b82;--line:#e1e6ef;--navy:#17366f;--red:#d9151b;--accent:var(--navy);--ok:#16a34a;--warn:#c81e24;--blue:var(--navy);--glass:#c5d3ec;--idle:#f0f3f8;--xl:#1d6f42}
.excel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:16px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--xl);border-radius:8px}
.excel .txt{flex:1 1 280px;min-width:0}
.excel small{display:block}
.excel .loi{display:block;color:var(--warn);font-size:13px}
.excel .r{display:flex;flex-wrap:wrap;gap:8px}
.btn.xl{background:var(--xl);border-color:var(--xl);color:#fff}
#frm input[readonly]{background:var(--idle);color:var(--mute)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wrap{max-width:1050px;margin:0 auto;padding:24px 16px 48px}
header{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:16px 24px}
.brand img{display:block;height:64px;width:auto;max-width:100%}
.brand .co{color:var(--navy);font-weight:700;font-size:16px}
.title{background:var(--navy);color:#fff;padding:24px;border-top:4px solid var(--red)}
header h1{margin:0 0 4px;font-size:24px;text-wrap:balance}
header p{margin:0;color:#d3dcee}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 20px;margin-top:16px;font-size:14px}
.meta b{color:#fff}
.sample{margin-top:12px;padding:10px 14px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:8px;font-size:14px}
h2{font-size:18px;margin:28px 0 12px;padding-left:10px;border-left:4px solid var(--accent)}

/* Danh sách công trình */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 12px}
.tools input,.tools select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.tools input{flex:1 1 260px;min-width:0}
.tools select{flex:0 1 220px;min-width:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ct,.ct-head{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.5fr) 200px 120px 124px;gap:12px;padding:12px 16px;align-items:center}
.ct-head{background:#f9fafb;color:var(--mute);font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.ct{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.ct:last-child{border-bottom:0}
.ct:hover{background:#f3f6fc}
.ct:hover .ct-name b{text-decoration:underline}
.ct-name b{display:block;color:var(--navy)}
small{color:var(--mute);font-size:13px}
.ct .num{font-variant-numeric:tabular-nums}
.ct-head .num,.ct .num{text-align:right}
.ct-prog{white-space:nowrap}
.ct-prog .bar{width:90px}
.ct-prog small{display:block}
.empty{padding:24px 16px;color:var(--mute);text-align:center}
a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.back{display:inline-block;margin:16px 0 0;color:var(--navy);font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}

/* Báo cáo chi tiết */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi .l{color:var(--mute);font-size:13px}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .v.good{color:var(--ok)}.kpi .v.bad{color:var(--warn)}
.kpi .s{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.note{margin:0 0 12px;color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f9fafb;font-size:13px;color:var(--mute);font-weight:600}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:700;background:#f9fafb;border-bottom:0}
.nowrap{white-space:nowrap}
.bar{background:#eef0f3;border-radius:6px;height:10px;width:110px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.bar i{display:block;height:100%;background:var(--blue)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:#dcfce7;color:var(--ok)}.t-late{background:#fee2e2;color:var(--warn)}.t-run{background:#dbeafe;color:var(--blue)}.t-wait{background:var(--idle);color:var(--mute)}
.minus{color:var(--warn)}.plus{color:var(--ok)}
.nodata{color:var(--mute);margin:0}

/* Sơ đồ mặt đứng: mỗi ô là một mặt của một tầng, ghi số m² đã lắp */
.elev{border-collapse:separate;border-spacing:3px;min-width:560px}
.elev th,.elev td{border:0;text-align:center;padding:6px 8px;font-variant-numeric:tabular-nums}
.elev th{background:none}
.elev th small{display:block;font-weight:400}
.elev td.f{font-weight:600;color:var(--mute);background:none;width:72px}
.elev td.t{font-weight:600;background:none;width:96px}
.elev td.d{background:var(--blue);color:#fff}
.elev td.p{background:linear-gradient(90deg,var(--glass) var(--p),#fff var(--p));box-shadow:inset 0 0 0 1px var(--blue);font-weight:600}
.elev td.w{background:var(--idle);color:var(--mute)}
.elev tr.sum td{background:none;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:12px;display:inline-block}
.l-d{background:var(--blue)}.l-p{background:linear-gradient(90deg,var(--glass) 50%,#fff 50%);box-shadow:inset 0 0 0 1px var(--blue)}.l-w{background:var(--idle);box-shadow:inset 0 0 0 1px var(--line)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.two>.card{min-width:0}
.two table{min-width:300px}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;text-align:center;margin-top:36px}
.sign div{min-height:110px}.sign b{display:block}.sign span{color:var(--mute);font-size:13px}
footer{margin-top:28px;color:var(--mute);font-size:12px;text-align:center}

/* Nút và form nhập liệu */
.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--navy);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:focus-visible,.del:focus-visible,#frm input:focus-visible,#frm textarea:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.actions .back{margin:0}
.actions .r{display:flex;flex-wrap:wrap;gap:8px}
.backup{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;color:var(--mute);font-size:14px}
.backup .sp{flex:1 1 auto}
.ask{margin-top:12px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.saved{margin-top:12px;padding:10px 14px;background:#dcfce7;color:#166534;border-radius:8px;font-size:14px}
.saved.bad{background:#fee2e2;color:var(--warn)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);min-width:0}
.field b{color:var(--warn);font-weight:600}
#frm input:not([type=checkbox]),#frm textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
#frm textarea{min-height:96px;resize:vertical;display:block}
#frm [aria-invalid]{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.hint{margin:0 0 10px;color:var(--mute);font-size:14px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.edit{min-width:560px}
.edit th,.edit td{padding:4px 5px;border-bottom:0}
.edit input[type=text]{min-width:110px}
.edit td.ck{text-align:center}
.edit td.x,.edit th.x{width:36px;padding:0}
.two .edit{min-width:340px}
.del{border:0;background:none;color:var(--mute);cursor:pointer;font-size:20px;line-height:1;padding:6px 10px;border-radius:6px}
.del:hover{color:var(--warn);background:#fee2e2}
.add{margin-top:8px}
#khoiMat{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
#khoiMat[hidden]{display:none}
#khoiMat .fields{margin-bottom:0}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;margin-top:24px;border-top:1px solid var(--line)}
.savebar .r{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.errs{background:#fee2e2;color:var(--warn);border-radius:8px;padding:10px 14px 10px 30px;margin:0 0 10px;font-size:14px;max-height:30vh;overflow:auto}

@media print{body{background:#fff}.wrap{padding:0}.card,.kpi,.sign{break-inside:avoid}h2{break-after:avoid}.back,.tools,.actions,.backup,.saved{display:none}}
@media(max-width:800px){
  .ct-head{display:none}
  .ct{grid-template-columns:1fr auto;gap:4px 12px}
  .ct-name{grid-column:1/-1}
  .ct-owner{grid-column:1/-1;color:var(--mute);font-size:14px}
  .ct .num{text-align:left}
  .ct .ct-prog{grid-column:1/-1}
  .ct-prog small{display:inline;margin-left:8px}
}
</style>
</head>

        (ex.loi ? '<span class="loi">' + esc(ex.loi) + "</span>" : "") + '</div><div class="r"><button type="button" class="btn xl" data-act="excel">Kết nối file Excel</button></div>' + nut + "</div>";
    }
    var luc = new Date(ex.luc), gio = luc.toLocaleTimeString("vi-VN") + " " + luc.toLocaleDateString("vi-VN");
    var trangThai = ex.canQuyen ? "Trình duyệt cần bạn cho phép đọc lại file sau khi mở trang."
      : ex.handle ? "Tự kiểm tra file mỗi 3 giây."
      : ex.thuCong ? "Trình duyệt này không tự theo dõi được file. Sau khi sửa Excel, hãy bấm Đổi file và chọn lại."
      : "Chưa kết nối lại file, đang hiện dữ liệu của lần đọc trước.";
    return '<div class="excel" id="excelBar"><div class="txt"><b>Danh sách lấy từ ' + esc(ex.tep) + "</b><small>Cập nhật lúc " + gio + ". " + trangThai + "</small>" +
      (ex.loi ? '<span class="loi">' + esc(ex.loi) + "</span>" : "") + '</div><div class="r">' +
      (ex.canQuyen ? '<button type="button" class="btn xl" data-act="quyen">Cho phép đọc file Excel</button>' : "") +
      '<button type="button" class="btn" data-act="excel">' + (ex.handle ? "Đổi file" : "Kết nối lại") + '</button><button type="button" class="btn danger" data-act="ngat">Ngắt kết nối</button></div>' + nut + "</div>";
  }
  function veThanh() { var el = q("#excelBar"); if (el) el.outerHTML = thanhExcel(); }
  function veLaiGiuViTri() {
    if (current === "form") return; // không làm mất nội dung đang nhập
    var y = window.scrollY, c = current;
    current = null; show(c); window.scrollTo(0, y);
  }
  document.addEventListener("change", function (e) {
    if (e.target.id === "tepExcel" && e.target.files[0]) { docTepThuCong(e.target.files[0]); e.target.value = ""; }
  });

  // Hiển thị trực tiếp khi bấm; địa chỉ #id chỉ để dùng được nút Back và gửi link khi trình duyệt cho phép.
  var current = null;
  function di(id) { show(id); try { location.hash = id; } catch (err) {} }
  function show(id) {
    var p = CONG_TRINH.filter(function (x) { return x.id === id; })[0];
    var key = p ? p.id : "";
    if (key === current) return;
    current = key;
    if (p) hienCongTrinh(p); else hienDanhSach();
    window.scrollTo(0, 0);
  }
  function fromHash() { show(decodeURIComponent(location.hash.slice(1))); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (b) { hanhDong(b); return; }
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    di(a.getAttribute("href").slice(1));
  });
  window.addEventListener("hashchange", function () {
    if (current === "form" && dirty && !window.confirm("Thay đổi chưa lưu sẽ mất. Vẫn rời trang nhập liệu?")) return;
    dirty = false;
    fromHash();
  });

  // Dùng bản Excel đọc lần trước ngay khi mở trang, rồi kết nối lại file để lấy bản mới.
  try {
    var snap = JSON.parse(localStorage.getItem(EX_KEY) || "null");
    if (snap && Array.isArray(snap.rows)) { ex.rows = snap.rows; ex.tep = snap.tep; ex.luc = snap.luc; apDungExcel(snap.rows); }
  } catch (e) {}
  fromHash();
  try {
    idb("readonly", function (st) { return st.get("excel"); }).then(function (h) {
      if (h && h.getFile) { ex.handle = h; kiemTraExcel(true); }
    }).catch(function () {});
  } catch (e) {}
  setInterval(function () { if (document.visibilityState === "visible") kiemTraExcel(false); }, 3000);
  window.addEventListener("focus", function () { kiemTraExcel(false); });
})();
</script>
